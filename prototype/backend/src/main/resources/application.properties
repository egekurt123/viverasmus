server.port=8081
viverasmus.upload-dir=${VIVERASMUS_UPLOAD_DIR:../apartment-photos}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/viverasmus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:viverasmus}
