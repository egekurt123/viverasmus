spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
viverasmus.admin.email=${VIVERASMUS_ADMIN_EMAIL:admin@viverasmus.com}
viverasmus.admin.password=${VIVERASMUS_ADMIN_PASSWORD:admin2027}
