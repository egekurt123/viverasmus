<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Vive home">
    <img
      class="brand-logo"
      src="assets/viverasmus%20logo.png"
      alt="Vive Erasmus" />
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>
    <a routerLink="/properties" routerLinkActive="active">Find a place</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
  </nav>

  <div class="header-actions">
    @if (auth.isAdmin()) {
      <a class="button button-dark header-action" routerLink="/admin" routerLinkActive="active">
        Rooms &amp; bookings
      </a>
    }

    @if (auth.account()) {
      <button type="button" class="button button-dark header-action logout" (click)="logout()">
        Log out
      </button>
    } @else {
      <a class="button button-dark header-action" routerLink="/login">Log in</a>
    }
      @if(!auth.isAdmin()) {
      <a class="button button-dark header-contact" routerLink="/contact">
        Contact
        <span>↗</span>
      </a>
      }
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="footer-top">
    <a class="brand brand-footer" routerLink="/" aria-label="Vive home">
      <img
        class="brand-logo"
        src="assets/viverasmus%20logo.png"
        alt="Vive Erasmus" />
    </a>
    <div class="footer-links">
      <span>© 2026 viverasmus</span>
    </div>
  </div>
</footer>
