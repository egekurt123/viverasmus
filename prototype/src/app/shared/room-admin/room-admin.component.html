<div class="room-admin" (click)="$event.stopPropagation()">
  <div
    class="status-toggle"
    role="group"
    [attr.aria-label]="'Status of ' + room.name">
    <button
      type="button"
      [class.chosen]="room.status === 'available'"
      (click)="setStatus('available')">
      Free
    </button>
    <button
      type="button"
      [class.chosen]="room.status === 'booked'"
      (click)="setStatus('booked')">
      Booked
    </button>
  </div>
  <div class="availability-date">
    <label>
      <span>Available from</span>
      <input
        type="date"
        [(ngModel)]="availableFrom"
        [attr.aria-label]="'Availability date of ' + room.name" />
    </label>
    <button type="button" class="save-occupancy" (click)="saveAvailability()">Save date</button>
    @if (availabilityError) {
      <span class="occupancy-error" role="alert">{{ availabilityError }}</span>
    }
  </div>
  @if (room.tenant) {
    <select
      [ngModel]="room.tenant.gender"
      (ngModelChange)="setGender($event)"
      [attr.aria-label]="'Gender of tenant in ' + room.name">
      <option value="female">Woman</option>
      <option value="male">Man</option>
    </select>
    <select
      [ngModel]="room.tenant.country"
      (ngModelChange)="setCountry($event)"
      [attr.aria-label]="'Home country of tenant in ' + room.name">
      @for (country of countries; track country.name) {
        <option [value]="country.name">
          {{ country.flag }} {{ country.name }}
        </option>
      }
    </select>
    <div class="occupancy-dates">
      <label>
        <span>Occupied from</span>
        <input
          type="date"
          [(ngModel)]="occupiedFrom"
          [attr.max]="occupiedUntil || null"
          [attr.aria-label]="'Occupancy start of ' + room.name" />
      </label>
      <label>
        <span>Occupied until</span>
        <input
          type="date"
          [(ngModel)]="occupiedUntil"
          [attr.min]="occupiedFrom || null"
          [attr.aria-label]="'Occupancy end of ' + room.name" />
      </label>
      <button type="button" class="save-occupancy" (click)="saveOccupancy()">Save dates</button>
      @if (occupancyError) {
        <span class="occupancy-error" role="alert">{{ occupancyError }}</span>
      }
    </div>
  }
</div>
