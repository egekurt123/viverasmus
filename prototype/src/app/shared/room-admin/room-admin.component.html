<div class="room-admin" (click)="$event.stopPropagation()">
  <div
    class="status-toggle"
    role="group"
    [attr.aria-label]="'Status of ' + room.name">
    <button
      type="button"
      [class.chosen]="room.status === 'available'"
      (click)="setStatus('available')">
      Free
    </button>
    <button
      type="button"
      [class.chosen]="room.status === 'booked'"
      (click)="setStatus('booked')">
      Booked
    </button>
  </div>
  <div class="availability-date">
    <label>
      <span>Available from</span>
      <span class="date-selects">
        <select [(ngModel)]="availableMonthDay" (ngModelChange)="availableFrom = ''" [attr.aria-label]="'Availability date of ' + room.name">
          @for (option of availableDateOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <select [(ngModel)]="availableYear" [attr.aria-label]="'Availability year of ' + room.name">
          @for (year of dateYears; track year) {
            <option [ngValue]="year">{{ year }}</option>
          }
        </select>
      </span>
    </label>
    <button type="button" class="save-occupancy" (click)="saveAvailability()">Save date</button>
    @if (availabilityError) {
      <span class="occupancy-error" role="alert">{{ availabilityError }}</span>
    }
  </div>
  @if (room.tenant) {
    <select
      [ngModel]="room.tenant.gender"
      (ngModelChange)="setGender($event)"
      [attr.aria-label]="'Gender of tenant in ' + room.name">
      <option value="female">Woman</option>
      <option value="male">Man</option>
    </select>
    <select
      [ngModel]="room.tenant.country"
      (ngModelChange)="setCountry($event)"
      [attr.aria-label]="'Home country of tenant in ' + room.name">
      @for (country of countries; track country.name) {
        <option [value]="country.name">
          {{ country.flag }} {{ country.name }}
        </option>
      }
    </select>
    <div class="occupancy-dates">
      <label>
        <span>Occupied from</span>
        <span class="date-selects">
          <select [(ngModel)]="occupiedFromMonthDay" [attr.aria-label]="'Occupancy start of ' + room.name">
            @for (option of availableDateOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
          <select [(ngModel)]="occupiedFromYear" [attr.aria-label]="'Occupancy start year of ' + room.name">
            @for (year of dateYears; track year) {
              <option [ngValue]="year">{{ year }}</option>
            }
          </select>
        </span>
      </label>
      <label>
        <span>Occupied until</span>
        <span class="date-selects">
          <select [(ngModel)]="occupiedUntilMonthDay" [attr.aria-label]="'Occupancy end of ' + room.name">
            @for (option of occupiedUntilOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
          <select [(ngModel)]="occupiedUntilYear" [attr.aria-label]="'Occupancy end year of ' + room.name">
            @for (year of dateYears; track year) {
              <option [ngValue]="year">{{ year }}</option>
            }
          </select>
        </span>
      </label>
      <button type="button" class="save-occupancy" (click)="saveOccupancy()">Save dates</button>
      @if (occupancyError) {
        <span class="occupancy-error" role="alert">{{ occupancyError }}</span>
      }
    </div>
  }
</div>
